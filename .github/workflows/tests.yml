name: Validate engineering BOM system

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run BOM validator tests
        run: python -m pytest -v
      - name: Generate synthetic BOM report
        run: python src/validate.py --output reports/bom_discrepancies.xlsx
